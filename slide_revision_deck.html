                tag: "PERFORMANCE",
                bullets: [
                    "<b>What is Backpressure?</b> Occurs when the <b>Producer (Reader)</b> reads data faster than the <b>Consumer (Writer)</b> can write to disk or network.",
                    "<b>Internal Buffer (highWaterMark):</b> When internal queue fills up to limit (default 16KB/64KB), <code>writer.write()</code> returns <code>false</code>.",
                    "<b>Flow Control:</b> Reader calls <code>reader.pause()</code> until writer flushes buffer and emits the <code>'drain'</code> event, then calls <code>reader.resume()</code>.",
                    "<b>Safe Piping:</b> <code>pipe()</code> & modern <code>pipeline()</code> manage backpressure and resource cleanup automatically without memory leaks."
                ],
                code: `// Manual Backpressure Flow Control:
const readStream = fs.createReadStream('large.mp4');
const writeStream = fs.createWriteStream('out.mp4');

readStream.on('data', (chunk) => {
    // If write buffer full, pause reading:
    const canWrite = writeStream.write(chunk);
    if (!canWrite) readStream.pause();
});

// Resume only when write buffer drains:
writeStream.on('drain', () => {
    readStream.resume();
});

// Modern Standard: pipeline() handles backpressure + cleanup:
const { pipeline } = require('stream/promises');
await pipeline(readStream, writeStream);`

                    "<b>1. Readable:</b> <code>fs.createReadStream('input.txt')</code> reads data source in 64KB chunks.",
                    "<b>2. Transform:</b> <code>new Transform()</code> modifies chunks on-the-fly (converts text to UPPERCASE).",
                    "<b>3. Duplex:</b> <code>new Duplex()</code> provides simultaneous 2-way read & write processing channel.",
                    "<b>4. Writable:</b> <code>fs.createWriteStream('output.txt')</code> saves final processed chunks to disk.",
                    "<b>Pipeline:</b> <code>pipeline(read, transform, duplex, write)</code> handles flow and backpressure with 0 RAM spikes!"
                ],
                code: `const fs = require('fs');
const { Transform, Duplex, pipeline } = require('stream');

// 1. READABLE: Source stream (64KB chunks)
const reader = fs.createReadStream('input.txt', 'utf8');

// 2. TRANSFORM: Converts chunk to UPPERCASE
const uppercase = new Transform({
  transform(chunk, enc, cb) {
    this.push(chunk.toString().toUpperCase());
    cb();
  }
});

// 3. DUPLEX: Two-way bidirectional channel
const duplexLogger = new Duplex({
  write(chunk, enc, cb) {
    this.push('[PROCESSED]: ' + chunk.toString());
    cb();
  },
  read(size) {}
});

// 4. WRITABLE: Final output file on disk
const writer = fs.createWriteStream('output.txt');

// 🔗 UNIFIED CHAIN (1 ➔ 2 ➔ 3 ➔ 4) with Auto Backpressure:
pipeline(reader, uppercase, duplexLogger, writer, (err) => {
  if (err) console.error('Pipeline Error:', err);
  else console.log('All 4 Streams processed successfully!');
});`

                code: `// 1. Custom AppError Class:
class AppError extends Error {
    constructor(message, statusCode) {
        super(message);
        this.statusCode = statusCode;
        this.status = \`\${statusCode}\`.startsWith('4') ? 'fail' : 'error';
        this.isOperational = true;
        Error.captureStackTrace(this, this.constructor);
    }
}

// 2. Centralized Error Middleware (4 args):
app.use((err, req, res, next) => {
    err.statusCode = err.statusCode || 500;
    res.status(err.statusCode).json({
        status: err.status || 'error',
        message: err.message,
        ...(process.env.NODE_ENV === 'development' && { stack: err.stack })
    });
});`

        let currentIndex = 0;
        const slideFrame = document.getElementById('slideFrame');
        const currentNumber = document.getElementById('currentNumber');
        const totalNumber = document.getElementById('totalNumber');
        const currentLabel = document.getElementById('currentLabel');
        const slideList = document.getElementById('slideList');
        const searchInput = document.getElementById('searchInput');

        totalNumber.innerText = masterDeck.length;

        function renderList(filter = '') {
            slideList.innerHTML = '';
            masterDeck.forEach((s, idx) => {
                if (filter && !s.name.toLowerCase().includes(filter.toLowerCase())) return;
                const div = document.createElement('div');
                div.className = `slide-item ${idx === currentIndex ? 'active' : ''} ${s.isTemplate ? 'missing-slide' : ''}`;
                
                let badge = '';
                if (s.isArch) badge = '<span class="badge-arch">MATRIX</span>';
                else if (s.isTemplate) badge = '<span class="badge-new">NEW</span>';

                div.innerHTML = `<span>${s.name}</span>${badge}`;
                div.onclick = () => loadSlide(idx);
                slideList.appendChild(div);
            });
        }

        function loadSlide(idx) {
            if (idx < 0 || idx >= masterDeck.length) return;
            currentIndex = idx;
            const slide = masterDeck[currentIndex];
            currentNumber.innerText = currentIndex + 1;
            currentLabel.innerText = `• ${slide.name}`;

            if (slide.isTemplate) {
                // EXACT ORIGINAL THEME: Black Header + Yellow Highlights with Red Underlines + White Canvas
                let headerContent = `
                    <div class="tmpl-header">
                        <div>Q. ${slide.qText} <span class="tag">${slide.tag || ''}</span></div>
                        <div class="tmpl-header-avatar">NODE</div>
                    </div>
                `;

                if (slide.isTable) {
                    let rowsHtml = slide.tableRows.map(r => `
                        <tr>
                            <td class="code-font">${r[0]}</td>
                            <td class="highlight-red">${r[1]}</td>
                            <td>${r[2]}</td>
                            <td class="highlight-green">${r[3]}</td>
                        </tr>
                    `).join('');

                    slideFrame.innerHTML = `
                        <div class="template-slide">
                            ${headerContent}
                            <div class="tmpl-body full-width">
                                <table class="tmpl-table">
                                    <thead>
                                        <tr>
                                            <th>${slide.tableHeaders[0]}</th>
                                            <th>${slide.tableHeaders[1]}</th>
                                            <th>${slide.tableHeaders[2]}</th>
                                            <th>${slide.tableHeaders[3]}</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${rowsHtml}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    `;
                } else if (slide.isCardsGrid) {
                    let leftBullets = slide.leftCard.bullets.map(b => `<div class="tmpl-card-bullet">❖ <span>${b}</span></div>`).join('');
                    let rightBullets = slide.rightCard.bullets.map(b => `<div class="tmpl-card-bullet">❖ <span>${b}</span></div>`).join('');

                    slideFrame.innerHTML = `
                        <div class="template-slide">
                            ${headerContent}
                            <div class="tmpl-body full-width">
                                <div class="tmpl-cards-grid">
                                    <div class="tmpl-card">
                                        <div class="tmpl-card-title">${slide.leftCard.title}</div>
                                        ${leftBullets}
                                    </div>
                                    <div class="tmpl-card">
                                        <div class="tmpl-card-title">${slide.rightCard.title}</div>
                                        ${rightBullets}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    let bulletsHtml = slide.bullets.map(b => `
                        <div class="tmpl-bullet">
                            <span class="diamond">❖</span>
                            <div>${b}</div>
                        </div>
                    `).join('');

                    slideFrame.innerHTML = `
                        <div class="template-slide">
                            ${headerContent}
                            <div class="tmpl-body">
                                <div class="tmpl-bullets">
                                    ${bulletsHtml}
                                </div>
                                <div class="tmpl-code-box">
                                    <div class="tmpl-code-header">
                                        <div class="dot dot-red"></div>
                                        <div class="dot dot-yellow"></div>
                                        <div class="dot dot-green"></div>
                                        <span>VS Code Example</span>
                                    </div>
                                    <pre class="tmpl-code-content"><code>${escapeHtml(slide.code || '')}</code></pre>
                                </div>
                            </div>
                        </div>
                    `;
                }
            } else {
                // Render Original Image Slide
                slideFrame.innerHTML = `<img class="slide-img" src="./nodejs_slides_complete/${slide.file}" alt="Slide">`;
            }

            document.querySelectorAll('.slide-item').forEach((el, i) => {
                el.classList.toggle('active', i === currentIndex);
            });

            const activeEl = document.querySelector('.slide-item.active');
            if (activeEl) activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        document.getElementById('prevBtn').onclick = () => loadSlide(currentIndex - 1);
        document.getElementById('nextBtn').onclick = () => loadSlide(currentIndex + 1);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                loadSlide(currentIndex + 1);
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                loadSlide(currentIndex - 1);
            }
        });

        document.getElementById('fullBtn').onclick = () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        };

        searchInput.oninput = (e) => renderList(e.target.value);

        // Initial Load
        renderList();
        loadSlide(0);
    </script>
